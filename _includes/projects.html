{% assign projects = site.projects | sort: "order" %}<div class="project-list">{% for project in projects %}<details class="project" {% if forloop.first %}open{% endif %}><summary><span><strong>{{ project.title }}</strong><small>{{ project.role }}｜{{ project.period }}</small></span><span class="toggle">＋</span></summary><div class="project-body markdown-body">{{ project.content }}</div></details>{% endfor %}</div>
